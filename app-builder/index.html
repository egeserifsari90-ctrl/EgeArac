<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ege App Builder</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>⚡ Ege App Builder</h1><p>Kendi web uygulamanı tasarla, dene ve indir.</p></div><span class="status">v1.0</span></header>
<main><section class="editor"><label for="name">Uygulama adı</label><input id="name" maxlength="60" value="Benim Uygulamam" autocomplete="off"><nav aria-label="Kod sekmeleri"><button class="tab active" data-tab="html">HTML</button><button class="tab" data-tab="css">CSS</button><button class="tab" data-tab="js">JavaScript</button></nav><label class="sr" for="code">Kod düzenleyici</label><textarea id="code" spellcheck="false" aria-label="Kod düzenleyici"></textarea><div class="actions"><button id="run" class="primary">▶ Önizle</button><button id="download">⬇ HTML indir</button><button id="save">💾 Kaydet</button><button id="reset">↺ Sıfırla</button></div><p id="message" aria-live="polite"></p></section><section class="preview"><h2>Canlı önizleme</h2><iframe id="frame" title="Uygulama önizlemesi" sandbox="allow-scripts"></iframe><small>Önizleme ayrı bir korumalı çerçevede çalışır. APK oluşturulmaz; indirilen dosya bir web uygulamasıdır.</small></section></main><script src="app.js"></script></body></html>
