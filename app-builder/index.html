<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ege App Builder 2</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>⚡ Ege App Builder 2</h1><p>Uygulama yapma aracı · kodla, önizle, indir</p></div><span class="status">v2.0</span></header>
<main><section class="editor">
<label for="name">Proje adı</label><input id="name" maxlength="60" autocomplete="off">
<label for="template">Hazır uygulama şablonu</label><select id="template"><option value="starter">Başlangıç</option><option value="notes">Not Defteri</option><option value="counter">Sayaç</option></select><button id="apply">Şablonu uygula</button>
<nav aria-label="Kod sekmeleri"><button class="tab active" data-tab="html">HTML</button><button class="tab" data-tab="css">CSS</button><button class="tab" data-tab="js">JavaScript</button></nav>
<label class="sr" for="code">Kod düzenleyici</label><textarea id="code" spellcheck="false"></textarea>
<div class="actions"><button id="run" class="primary">▶ Önizle</button><button id="download">⬇ HTML indir</button><button id="export">⬇ Projeyi dışa aktar</button><button id="import">⬆ Proje içe aktar</button><button id="save">💾 Kaydet</button><button id="reset">↺ Sıfırla</button></div>
<input type="file" id="file" accept=".json,application/json" hidden><p id="message" aria-live="polite"></p></section><section class="preview"><h2>Uygulama önizlemesi</h2><iframe id="frame" title="Uygulama önizlemesi" sandbox="allow-scripts"></iframe><small>Bu araç web uygulamaları oluşturur. Doğrudan APK/AAB üretimi ve GitHub'a otomatik depo açma henüz yoktur.</small></section></main><script src="app.js"></script></body></html>
