name: Build Minecraft Android ARM64 companion
on:
  workflow_dispatch:
  push:
    paths:
      - 'MinecraftAndroidARM64/**'
      - '.github/workflows/minecraft-android-arm64.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile ARM64 companion APK
        working-directory: MinecraftAndroidARM64
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and ARM64 metadata
        run: |
          APK='MinecraftAndroidARM64/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.egesarif.minecraftandroid'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a' || true
      - uses: actions/upload-artifact@v4
        with:
          name: EgeMinecraft-Android-ARM64-debug
          path: MinecraftAndroidARM64/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
